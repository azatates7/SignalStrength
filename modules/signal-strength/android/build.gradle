plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.signalstrength'
version = '0.1.0'

android {
  namespace "expo.modules.signalstrength"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // Uygulama içi değerlendirme penceresi (Google Play In-App Review). İzin gerektirmez.
  implementation 'com.google.android.play:review:2.0.2'
}